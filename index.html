<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Lista de Súper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --sage:#6B8F5E;
    --sage-deep:#4A6B3E;
    --cream:#F7F5EF;
    --paper:#FFFFFF;
    --ink:#2E2E2A;
    --ink-soft:#6B6B62;
    --line:#E4E1D6;
    --danger:#C97B7B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Poppins', sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100svh;
  }
  .wrap{ max-width:520px; margin:0 auto; padding:0 0 6rem; min-height:100svh; }

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6vh 6vw; text-align:center;
  }
  #loginScreen h1{ font-size:1.9rem; color:var(--sage-deep); font-weight:700; margin-bottom:.3rem;}
  #loginScreen p.sub{ color:var(--ink-soft); font-size:.92rem; margin-bottom:2.2rem;}
  .field{ width:100%; max-width:340px; text-align:left; margin-bottom:1rem; }
  .field label{ font-size:.78rem; color:var(--ink-soft); margin-bottom:.35rem; display:block; }
  .field input{
    width:100%; padding:.85rem 1rem; border-radius:12px; border:1.5px solid var(--line);
    font-family:inherit; font-size:1rem; background:var(--paper);
  }
  .field input:focus{ outline:none; border-color:var(--sage); }
  .btn-primary{
    width:100%; max-width:340px; background:var(--sage-deep); color:#fff; border:none;
    padding:.95rem; border-radius:12px; font-family:inherit; font-size:1rem; font-weight:600;
    cursor:pointer; margin-top:.5rem;
  }
  .btn-primary:active{ transform:scale(.98); }
  #loginError{ color:var(--danger); font-size:.85rem; margin-top:.9rem; min-height:1.2rem; }

  /* ---------- APP ---------- */
  #appScreen{ display:none; }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--sage-deep); color:#fff;
    padding:1.3rem 1.4rem 1.6rem; border-radius:0 0 24px 24px;
  }
  header .top{ display:flex; justify-content:space-between; align-items:center; }
  header h1{ font-size:1.4rem; font-weight:700; }
  header .who{ font-size:.75rem; opacity:.85; margin-top:.15rem; }
  #logoutBtn{
    background:rgba(255,255,255,.15); border:none; color:#fff; padding:.5rem .8rem;
    border-radius:10px; font-size:.75rem; font-family:inherit; cursor:pointer;
  }
  .progress-row{ margin-top:1rem; font-size:.8rem; opacity:.9; }

  .add-form{
    display:flex; gap:.6rem; padding:1.1rem 1.2rem 0;
  }
  .add-form input{
    flex:1; padding:.85rem 1rem; border-radius:12px; border:1.5px solid var(--line);
    font-family:inherit; font-size:.95rem; background:var(--paper);
  }
  .add-form input:focus{ outline:none; border-color:var(--sage); }
  .add-form button{
    background:var(--sage); color:#fff; border:none; width:48px; border-radius:12px;
    font-size:1.4rem; cursor:pointer; flex-shrink:0;
  }

  .list{ padding:1.2rem; display:flex; flex-direction:column; gap:.6rem; }
  .item{
    display:flex; align-items:center; gap:.8rem;
    background:var(--paper); border-radius:14px; padding:.9rem 1rem;
    box-shadow:0 3px 10px -4px rgba(0,0,0,.08);
  }
  .item .check{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--sage);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background .2s ease;
  }
  .item.checked .check{ background:var(--sage); }
  .item .check svg{ width:14px; height:14px; opacity:0; }
  .item.checked .check svg{ opacity:1; }
  .item .info{ flex:1; min-width:0; }
  .item .name{ font-size:.98rem; font-weight:500; }
  .item.checked .name{ text-decoration:line-through; color:var(--ink-soft); }
  .item .qty{ font-size:.78rem; color:var(--ink-soft); margin-top:.1rem; }
  .item .added{ font-size:.68rem; color:var(--ink-soft); opacity:.7; margin-top:.15rem; }
  .item .del{
    background:none; border:none; color:var(--danger); font-size:1.1rem; cursor:pointer;
    padding:.3rem; flex-shrink:0; opacity:.6;
  }
  .empty{ text-align:center; padding:3rem 1rem; color:var(--ink-soft); font-size:.9rem; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>🛒 Lista de Súper</h1>
  <p class="sub">Compartida entre Eduardo y Lineth</p>
  <div class="field">
    <label>Correo</label>
    <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn-primary" id="loginBtn">Entrar</button>
  <div id="loginError"></div>
</div>

<div id="appScreen">
  <div class="wrap">
    <header>
      <div class="top">
        <div>
          <h1>Lista de Súper</h1>
          <div class="who" id="whoLabel"></div>
        </div>
        <button id="logoutBtn">Salir</button>
      </div>
      <div class="progress-row" id="progressRow"></div>
    </header>

    <form class="add-form" id="addForm">
      <input type="text" id="newItemName" placeholder="Agregar item..." autocomplete="off">
      <button type="submit">+</button>
    </form>

    <div class="list" id="list"></div>
  </div>
</div>

<script>
  // ======= CONFIGURA ESTO =======
  const SUPABASE_URL = "https://shtrymsmbfbgckusetwl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_5fQr0skT0bUR5yTHvJGv_Q_yXFkyBti";
  // ===============================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const whoLabel = document.getElementById('whoLabel');
  const listEl = document.getElementById('list');
  const progressRow = document.getElementById('progressRow');
  const addForm = document.getElementById('addForm');
  const newItemName = document.getElementById('newItemName');

  let currentUser = null;
  let items = [];

  // ---------- AUTH ----------
  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    loginError.textContent = '';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      loginError.textContent = 'Correo o contraseña incorrectos.';
      return;
    }
    onLogin(data.user);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if (data.session) {
      onLogin(data.session.user);
    }
  }

  function onLogin(user){
    currentUser = user;
    loginScreen.style.display = 'none';
    appScreen.style.display = 'block';
    whoLabel.textContent = user.email;
    loadItems();
    subscribeRealtime();
  }

  // ---------- ITEMS ----------
  async function loadItems(){
    const { data, error } = await sb.from('items').select('*').order('created_at', { ascending: true });
    if (!error) {
      items = data;
      render();
    }
  }

  function subscribeRealtime(){
    sb.channel('items-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, () => {
        loadItems();
      })
      .subscribe();
  }

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = newItemName.value.trim();
    if (!name) return;
    newItemName.value = '';
    await sb.from('items').insert({ name, added_by: currentUser.email });
  });

  async function toggleItem(id, checked){
    await sb.from('items').update({ checked: !checked }).eq('id', id);
  }

  async function deleteItem(id){
    await sb.from('items').delete().eq('id', id);
  }

  function render(){
    if (items.length === 0) {
      listEl.innerHTML = '<div class="empty">La lista está vacía. Agrega algo arriba 🌱</div>';
      progressRow.textContent = '';
      return;
    }
    const doneCount = items.filter(i => i.checked).length;
    progressRow.textContent = `${doneCount} de ${items.length} completados`;

    listEl.innerHTML = items.map(item => `
      <div class="item ${item.checked ? 'checked' : ''}" data-id="${item.id}">
        <div class="check" onclick="window.__toggle('${item.id}', ${item.checked})">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <div class="info">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="added">agregado por ${item.added_by ? item.added_by.split('@')[0] : '—'}</div>
        </div>
        <button class="del" onclick="window.__del('${item.id}')">✕</button>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  window.__toggle = toggleItem;
  window.__del = deleteItem;

  checkSession();
</script>
</body>
</html>
