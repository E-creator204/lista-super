<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Lista de Súper</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://js.hcaptcha.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.hcaptcha.com; frame-src https://*.hcaptcha.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
  :root{
    --bg:#1E2A22;
    --card:#2B3D31;
    --card-done:#232F27;
    --input-bg:#EFE6D0;
    --input-text:#1E2A22;
    --gold:#D9A441;
    --text-light:#F4EEE0;
    --muted:#8FA08E;
    --muted2:#6B7A6A;
    --muted3:#7A8579;
    --line:#3A4A3E;
    --danger:#C1554B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Mono', monospace;
    background:var(--bg);
    color:var(--text-light);
    min-height:100svh;
  }
  .handwritten{ font-family:'Caveat', cursive; }
  input, select, button{ font-family:inherit; }

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6vh 6vw; text-align:center;
  }
  #loginScreen h1{ font-family:'Caveat', cursive; font-size:2.6rem; color:var(--gold); font-weight:700; }
  #loginScreen p.sub{ color:var(--muted); font-size:.85rem; margin-bottom:2rem;}
  .field{ width:100%; max-width:320px; text-align:left; margin-bottom:.9rem; }
  .field label{ font-size:.72rem; color:var(--muted); margin-bottom:.3rem; display:block; }
  .field input{
    width:100%; padding:.8rem .9rem; border-radius:10px; border:none;
    font-size:.95rem; background:var(--input-bg); color:var(--input-text);
  }
  .field input:focus{ outline:2px solid var(--gold); }
  .btn-primary{
    width:100%; max-width:320px; background:var(--gold); color:var(--bg); border:none;
    padding:.85rem; border-radius:10px; font-size:.95rem; font-weight:600;
    cursor:pointer; margin-top:.4rem;
  }
  #loginError{ color:#E08787; font-size:.8rem; margin-top:.8rem; min-height:1.1rem; }

  /* ---------- APP ---------- */
  #appScreen{ display:none; min-height:100svh; flex-direction:column; }
  header{
    padding:1.2rem 1.2rem .9rem; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  header .htitle{ font-family:'Caveat', cursive; font-size:2rem; color:var(--gold); line-height:1; }
  header .hsub{ font-size:.68rem; color:var(--muted2); margin-top:.2rem; }
  #logoutBtn{
    background:none; border:1px solid var(--line); color:var(--muted); padding:.4rem .7rem;
    border-radius:8px; font-size:.68rem; cursor:pointer;
  }

  .list{ flex:1; overflow-y:auto; padding:1rem 1rem 8rem; }
  .empty{ text-align:center; margin-top:4rem; color:var(--muted); }
  .empty .icon{ font-size:2rem; opacity:.5; margin-bottom:.4rem; }
  .empty .big{ font-family:'Caveat', cursive; font-size:1.5rem; }
  .empty .small{ font-size:.7rem; margin-top:.2rem; }

  .cat-group{ margin-bottom:1.3rem; }
  .cat-head{ display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem; padding:0 .2rem; }
  .cat-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .cat-label{ font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }

  .item{
    background:var(--card); border-radius:12px; padding:.65rem .8rem; margin-bottom:.5rem;
    display:flex; align-items:center; gap:.7rem;
  }
  .item .check{
    width:24px; height:24px; border-radius:50%; flex-shrink:0; border:2px solid #7FB069;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:none;
  }
  .item .check svg{ width:13px; height:13px; opacity:0; }
  .item .name{ flex:1; font-size:.9rem; word-break:break-word; }
  .item .by{ font-size:.62rem; color:var(--muted2); flex-shrink:0; }
  .item button.icon-btn{ background:none; border:none; cursor:pointer; padding:.2rem; flex-shrink:0; }
  .item .pencil{ color:var(--muted); }
  .item .trash{ color:var(--danger); }

  .item.editing{ flex-wrap:wrap; }
  .item.editing input{
    flex:1; min-width:100px; padding:.4rem .6rem; border-radius:6px; border:none;
    background:var(--input-bg); color:var(--input-text); font-size:.85rem;
  }
  .item.editing select{
    padding:.35rem .4rem; border-radius:6px; border:none; background:var(--input-bg);
    color:var(--input-text); font-size:.72rem;
  }

  .done-divider{ display:flex; align-items:center; gap:.6rem; margin:1.1rem 0 .6rem; }
  .done-divider .hline{ flex:1; height:1px; background:var(--line); }
  .done-divider span{ font-size:.65rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted2); }
  .item.done{ background:var(--card-done); opacity:.65; }
  .item.done .name{ text-decoration:line-through; color:var(--muted3); }
  .item.done .check{ background:var(--gold); border-color:var(--gold); }
  .item.done .check svg{ opacity:1; }

  /* ---------- ADD BAR ---------- */
  .addbar{
    position:fixed; bottom:0; left:0; right:0; background:#24332A;
    border-top:1px solid var(--line); padding:.8rem 1rem; z-index:20;
  }
  .addbar-row{ display:flex; gap:.5rem; align-items:center; }
  .cat-select-wrap{ position:relative; flex-shrink:0; }
  .cat-select-wrap select{
    appearance:none; border:none; border-radius:999px; padding:.55rem 1.4rem .55rem .7rem;
    font-size:.68rem; font-weight:600; color:var(--bg); cursor:pointer;
  }
  .cat-select-wrap .chev{ position:absolute; right:.4rem; top:50%; transform:translateY(-50%); pointer-events:none; font-size:.6rem; color:var(--bg); }
  .addbar input{
    flex:1; min-width:0; padding:.65rem .8rem; border-radius:10px; border:none;
    background:var(--input-bg); color:var(--input-text); font-size:.9rem;
  }
  .addbar button.add-btn{
    background:var(--gold); border:none; border-radius:10px; width:42px; height:38px;
    flex-shrink:0; font-size:1.2rem; color:var(--bg); cursor:pointer;
  }
  .hint{ font-size:.62rem; color:var(--muted2); margin-top:.35rem; margin-left:.2rem; }
  .hint b{ font-weight:600; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>🛒 lista de súper</h1>
  <p class="sub">Compartida entre Eduardo y Lineth</p>
  <div class="field">
    <label>Correo</label>
    <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <div class="h-captcha" data-sitekey="362e57f0-7230-4bec-9166-fd9487e85e04" data-callback="onCaptchaOk"></div>
  <button class="btn-primary" id="loginBtn" disabled>Entrar</button>
  <div id="loginError"></div>
</div>

<div id="appScreen">
  <header>
    <div>
      <div class="htitle">lista de súper</div>
      <div class="hsub" id="whoLabel"></div>
    </div>
    <button id="logoutBtn">Salir</button>
  </header>

  <div class="list" id="list"></div>

  <div class="addbar">
    <div class="addbar-row">
      <div class="cat-select-wrap">
        <select id="catSelect"></select>
        <span class="chev">▾</span>
      </div>
      <input type="text" id="newItemName" placeholder="agregar producto…" autocomplete="off" maxlength="200">
      <button class="add-btn" id="addBtn">+</button>
    </div>
    <div class="hint" id="hintRow"></div>
  </div>
</div>

<script>
  // ======= CONFIGURACIÓN SUPABASE =======
  const SUPABASE_URL = "https://shtrymsmbfbgckusetwl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_5fQr0skT0bUR5yTHvJGv_Q_yXFkyBti";
  // ========================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- Categorías + clasificador automático (portado del original) ----------
  const CATEGORIES = [
    { id: "frutas", label: "Frutas y verduras", short: "Frutas/Verd.", color: "#7FB069" },
    { id: "lacteos", label: "Lácteos y huevos", short: "Lácteos", color: "#E3CD7C" },
    { id: "carnes", label: "Carnes y pescado", short: "Carnes", color: "#C1554B" },
    { id: "panaderia", label: "Panadería", short: "Panadería", color: "#C99B5D" },
    { id: "limpieza", label: "Limpieza", short: "Limpieza", color: "#6FA8C7" },
    { id: "bebidas", label: "Bebidas", short: "Bebidas", color: "#4FA8A0" },
    { id: "otros", label: "Otros", short: "Otros", color: "#A98FC4" },
  ];
  const catById = (id) => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1];

  const normalize = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

  const CATEGORY_KEYWORDS = {
    frutas: ["manzana","banana","guineo","platano","naranja","limon","lima","uva","pera","mango","pina","sandia","melon","fresa","frutilla","papaya","aguacate","tomate","cebolla","papa","zanahoria","lechuga","brocoli","espinaca","pepino","pimenton","ajo","apio","cilantro","culantro","yuca","name","otoe","repollo","calabaza","zapallo","elote","maiz","chayote","durazno","kiwi","coco","cebollin","vegetal","verdura","fruta","champinon","hongo"],
    lacteos: ["leche","queso","yogur","yogurt","mantequilla","huevo","huevos","crema","natilla","margarina","requeson"],
    carnes: ["pollo","carne","res","cerdo","puerco","pescado","camaron","tocino","jamon","salchicha","chorizo","atun","mortadela","pavo","costilla","chuleta","marisco","langosta","filete","molida","bistec","salami","pepperoni"],
    panaderia: ["pan","tortilla","galleta","bizcocho","torta","croissant","pastel","dona","hojaldre","baguette","hot dog","hotdog","hamburguesa pan","empanada"],
    limpieza: ["detergente","jabon","cloro","desinfectante","papel higienico","papel toalla","servilleta","escoba","esponja","suavizante","lavaplatos","ambientador","bolsa de basura","bolsas de basura","shampoo","champu","pasta dental","cepillo de dientes","desodorante","toallitas","fabuloso","pinol","limpiador"],
    bebidas: ["agua","jugo","refresco","soda","cerveza","vino","cafe","te ", " te","chicha","gaseosa","energizante","malta","leche de coco","coca cola","pepsi"],
  };

  function classify(rawText){
    const t = normalize(rawText);
    if (!t) return null;
    for (const cat of CATEGORIES) {
      const words = CATEGORY_KEYWORDS[cat.id];
      if (!words) continue;
      for (const kw of words) if (t.includes(kw)) return cat.id;
    }
    return "otros";
  }

  // ---------- DOM refs ----------
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const whoLabel = document.getElementById('whoLabel');
  const listEl = document.getElementById('list');
  const newItemName = document.getElementById('newItemName');
  const addBtn = document.getElementById('addBtn');
  const catSelect = document.getElementById('catSelect');
  const hintRow = document.getElementById('hintRow');

  let currentUser = null;
  let items = [];
  let manualCat = null;
  let editingId = null;

  // Populate category select
  catSelect.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.short}</option>`).join('');
  function updateCatSelectColor(){
    catSelect.style.background = catById(catSelect.value).color;
  }
  catSelect.addEventListener('change', () => { manualCat = catSelect.value; updateCatSelectColor(); });
  updateCatSelectColor();

  newItemName.addEventListener('input', () => {
    const t = newItemName.value.trim();
    if (!manualCat) {
      const detected = classify(t) || 'otros';
      catSelect.value = detected;
      updateCatSelectColor();
    }
    if (t === '') { manualCat = null; }
    if (t) {
      const c = catById(catSelect.value);
      hintRow.innerHTML = `clasificado como <b style="color:${c.color}">${c.label}</b> · toca el círculo para cambiarlo`;
    } else {
      hintRow.innerHTML = '';
    }
  });

  // ---------- AUTH ----------
  window.onCaptchaOk = () => { loginBtn.disabled = false; };

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const captchaToken = hcaptcha.getResponse();
    loginError.textContent = '';
    const { data, error } = await sb.auth.signInWithPassword({
      email, password,
      options: { captchaToken }
    });
    hcaptcha.reset();
    loginBtn.disabled = true;
    if (error) { loginError.textContent = 'Correo o contraseña incorrectos.'; return; }
    onLogin(data.user);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    stopIdleTimer();
    await sb.auth.signOut();
    location.reload();
  });

  // ---------- AUTO-LOGOUT POR INACTIVIDAD ----------
  let idleTimer;
  const IDLE_LIMIT_MS = 15 * 60 * 1000; // 15 minutos, ajusta si quieres

  function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(async () => {
      await sb.auth.signOut();
      location.reload();
    }, IDLE_LIMIT_MS);
  }

  function startIdleTimer() {
    ['mousemove', 'keydown', 'touchstart', 'click'].forEach(evt =>
      document.addEventListener(evt, resetIdleTimer)
    );
    resetIdleTimer();
  }

  function stopIdleTimer() {
    clearTimeout(idleTimer);
    ['mousemove', 'keydown', 'touchstart', 'click'].forEach(evt =>
      document.removeEventListener(evt, resetIdleTimer)
    );
  }

  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if (data.session) onLogin(data.session.user);
  }

  function onLogin(user){
    currentUser = user;
    loginScreen.style.display = 'none';
    appScreen.style.display = 'flex';
    whoLabel.textContent = user.email.split('@')[0];
    loadItems();
    subscribeRealtime();
    startIdleTimer();
  }

  // ---------- DATA ----------
  async function loadItems(){
    const { data, error } = await sb.from('items').select('*').order('created_at', { ascending: true });
    if (!error) { items = data; render(); }
  }

  function subscribeRealtime(){
    sb.channel('items-realtime')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'items' }, (payload) => {
        if (!items.find(i => i.id === payload.new.id)) {
          items.push(payload.new);
          render();
        }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'items' }, (payload) => {
        const idx = items.findIndex(i => i.id === payload.new.id);
        if (idx !== -1) { items[idx] = payload.new; render(); }
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'items' }, (payload) => {
        items = items.filter(i => i.id !== payload.old.id);
        render();
      })
      .subscribe();
  }

  async function addItem(){
    const t = newItemName.value.trim();
    if (!t) return;
    const category = manualCat || classify(t) || 'otros';
    newItemName.value = '';
    manualCat = null;
    hintRow.innerHTML = '';
    await sb.from('items').insert({ name: t, category });
  }
  addBtn.addEventListener('click', addItem);
  newItemName.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

  async function toggleItem(id, checked){
    await sb.from('items').update({ checked: !checked, checked_at: !checked ? new Date().toISOString() : null }).eq('id', id);
  }
  async function deleteItem(id){
    await sb.from('items').delete().eq('id', id);
  }
  function startEdit(id){ editingId = id; render(); }
  async function commitEdit(id){
    const nameInput = document.getElementById('edit-name-' + id);
    const catInput = document.getElementById('edit-cat-' + id);
    const t = nameInput.value.trim();
    if (!t) { editingId = null; render(); return; }
    await sb.from('items').update({ name: t, category: catInput.value }).eq('id', id);
    editingId = null;
  }

  window.__toggle = toggleItem;
  window.__del = deleteItem;
  window.__edit = startEdit;
  window.__commitEdit = commitEdit;

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>`;

  function render(){
    const active = items.filter(i => !i.checked);
    const done = items.filter(i => i.checked).sort((a,b) => new Date(a.checked_at||0) - new Date(b.checked_at||0));

    if (items.length === 0) {
      listEl.innerHTML = `<div class="empty"><div class="icon">🛒</div><div class="big">la lista está vacía</div><div class="small">agrega el primer producto abajo</div></div>`;
      return;
    }

    const groups = CATEGORIES.map(c => ({
      ...c,
      items: active.filter(i => i.category === c.id).sort((a,b) => new Date(a.created_at) - new Date(b.created_at))
    })).filter(g => g.items.length > 0);

    let html = groups.map(g => `
      <div class="cat-group">
        <div class="cat-head">
          <span class="cat-dot" style="background:${g.color}"></span>
          <span class="cat-label">${g.label}</span>
        </div>
        ${g.items.map(item => itemHtml(item, g.color, false)).join('')}
      </div>
    `).join('');

    if (done.length > 0) {
      html += `
        <div class="done-divider"><div class="hline"></div><span>en el carrito</span><div class="hline"></div></div>
        ${done.map(item => itemHtml(item, catById(item.category).color, true)).join('')}
      `;
    }

    listEl.innerHTML = html;
  }

  function itemHtml(item, color, isDone){
    if (editingId === item.id) {
      return `
        <div class="item editing">
          <input type="text" id="edit-name-${item.id}" value="${escapeHtml(item.name)}">
          <select id="edit-cat-${item.id}">
            ${CATEGORIES.map(c => `<option value="${c.id}" ${c.id===item.category?'selected':''}>${c.short}</option>`).join('')}
          </select>
          <button class="icon-btn" style="color:#7FB069" onclick="window.__commitEdit('${item.id}')">✓</button>
        </div>`;
    }
    return `
      <div class="item ${isDone ? 'done' : ''}">
        <button class="check" style="${isDone ? '' : `border-color:${color}`}" onclick="window.__toggle('${item.id}', ${item.checked})">${CHECK_SVG}</button>
        <span class="name">${escapeHtml(item.name)}</span>
        <span class="by">${item.added_by ? escapeHtml(item.added_by.split('@')[0]) : ''}</span>
        ${!isDone ? `<button class="icon-btn pencil" onclick="window.__edit('${item.id}')">✎</button>` : ''}
        <button class="icon-btn trash" onclick="window.__del('${item.id}')">🗑</button>
      </div>`;
  }

  checkSession();
</script>
</body>
</html>
